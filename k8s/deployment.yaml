apiVersion: apps/v1
kind: Deployment
metadata:
  name: revibe-deployment
  labels:
    app: revibe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revibe
  template:
    metadata:
      labels:
        app: revibe
    spec:
      containers:
        - name: revibe
          image: ghcr.io/skit-devops-2026/devops-24eskcs096:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: MONGO_URL
              value: "mongodb://revibe-mongo-service:27017/ReVibe"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
