global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'revibe-web'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['web:8080', 'localhost:8080']
        labels:
          app: 'revibe'
          environment: 'production'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
